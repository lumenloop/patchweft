name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --jobs 2 -- -D warnings
      - run: cargo test --locked --jobs 2 -- --test-threads=2
      - run: cargo build --release --locked --jobs 2
      - run: python3 examples/shared-prep/run.py --binary ./target/release/patchweft
