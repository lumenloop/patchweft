name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --jobs 2 -- -D warnings
      - run: cargo test --locked --jobs 2 -- --test-threads=2
      - run: cargo build --release --locked --jobs 2
      - run: python3 examples/shared-prep/run.py --binary ./target/release/patchweft
